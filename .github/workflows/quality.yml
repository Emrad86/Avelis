name: Avelis browser quality
on:
  push:
    branches: [main]
    paths: ['docs/**', 'tests/**', '.github/workflows/quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avelis-visual-screenshots
          path: avelis-*.png
          if-no-files-found: ignore
          retention-days: 7
